<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>เช็คการปรับสต็อก</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------- โทนสี ---------- */
:root{
  color-scheme: light dark;
  --bg:#f5f6f8; --surface:#ffffff; --sunken:#f0f2f5; --line:#e4e7ec;
  --text:#101828; --muted:#667085; --faint:#98a2b3; --accent:#4f46e5;
  --ok:#059669;    --ok-bg:#ecfdf5;   --ok-line:#a7f3d0;
  --warn:#d97706;  --warn-bg:#fffbeb; --warn-line:#fde68a;
  --bad:#e11d48;   --bad-bg:#fff1f2;  --bad-line:#fecdd3;
  --r:14px;
  --shadow:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0e1116; --surface:#171b22; --sunken:#1e232c; --line:#2a3039;
    --text:#e8eaed; --muted:#9aa4b2; --faint:#6b7684; --accent:#818cf8;
    --ok:#34d399;   --ok-bg:#06281f;   --ok-line:#065f46;
    --warn:#fbbf24; --warn-bg:#2a1f05; --warn-line:#78500a;
    --bad:#fb7185;  --bad-bg:#2b0d14;  --bad-line:#7f1d2e;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:"Noto Sans Thai",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5;
  padding-bottom:calc(32px + env(safe-area-inset-bottom));
}

header{
  position:sticky; top:0; z-index:20;
  background:color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter:saturate(1.6) blur(12px);
  border-bottom:1px solid var(--line);
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
}
.title{font-size:17px; font-weight:700; letter-spacing:-.01em;}
.sub{font-size:12.5px; color:var(--muted); margin-top:2px;}
.dot{color:var(--faint); padding:0 5px;}

/* การ์ดสถิติ = ปุ่มกรองในตัว ลดจำนวนคอนโทรลบนจอเล็ก */
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px;}
.stat{
  border:1px solid var(--line); border-radius:12px; background:var(--surface);
  padding:9px 8px; text-align:center; cursor:pointer; min-height:56px;
  transition:border-color .15s, background .15s, transform .08s;
}
.stat:active{transform:scale(.97);}
.stat b{display:block; font-size:19px; font-weight:700; line-height:1.25;}
.stat span{font-size:11px; color:var(--muted);}
.stat.on{border-width:2px; padding:8px 7px;}
.s-done b{color:var(--ok);}      .stat.on.s-done{background:var(--ok-bg); border-color:var(--ok);}
.s-partial b{color:var(--warn);} .stat.on.s-partial{background:var(--warn-bg); border-color:var(--warn);}
.s-none b{color:var(--bad);}     .stat.on.s-none{background:var(--bad-bg); border-color:var(--bad);}

.searchwrap{position:relative; margin-top:10px;}
.searchwrap svg{
  position:absolute; left:12px; top:50%; transform:translateY(-50%);
  width:17px; height:17px; stroke:var(--faint); fill:none; stroke-width:2;
}
input[type=search]{
  width:100%; padding:11px 12px 11px 36px; font-size:15px;
  border:1px solid var(--line); border-radius:11px;
  background:var(--sunken); color:var(--text);
  font-family:inherit; -webkit-appearance:none;
}
input[type=search]:focus{outline:2px solid var(--accent); outline-offset:-1px; background:var(--surface);}

main{padding:12px 12px 0;}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  margin-bottom:9px; box-shadow:var(--shadow); overflow:hidden;
}
summary{list-style:none; cursor:pointer; padding:13px 14px; display:block; min-height:44px;}
summary::-webkit-details-marker{display:none;}
summary:active{background:var(--sunken);}
.head{display:flex; align-items:center; gap:10px;}
.nm{font-weight:600; flex:1; min-width:0; letter-spacing:-.005em;}
.pill{
  font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:99px;
  white-space:nowrap; border:1px solid transparent;
}
.p-done{background:var(--ok-bg); color:var(--ok); border-color:var(--ok-line);}
.p-partial{background:var(--warn-bg); color:var(--warn); border-color:var(--warn-line);}
.p-none{background:var(--bad-bg); color:var(--bad); border-color:var(--bad-line);}
.chev{
  width:18px; height:18px; flex:0 0 18px; stroke:var(--faint); fill:none;
  stroke-width:2.2; transition:transform .2s ease;
}
details[open] .chev{transform:rotate(180deg);}

.meta{display:flex; justify-content:space-between; margin-top:8px; font-size:12.5px; color:var(--muted);}
.meta b{color:var(--text); font-weight:600;}
.bar{height:6px; background:var(--sunken); border-radius:99px; margin-top:7px; overflow:hidden;}
.bar i{display:block; height:100%; border-radius:99px; transition:width .3s ease;}
.c-done .bar i{background:var(--ok);}
.c-partial .bar i{background:var(--warn);}
.c-none .bar i{background:var(--bad);}

.panel{padding:0 14px 12px; animation:reveal .18s ease;}
@keyframes reveal{from{opacity:0; transform:translateY(-4px);}}
table{width:100%; border-collapse:collapse; font-size:13.5px;}
thead th{
  text-align:left; font-size:10.5px; font-weight:700; letter-spacing:.04em;
  text-transform:uppercase; color:var(--faint);
  padding:8px 2px; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
}
th.r, td.r{text-align:right;}
td{padding:9px 2px; border-bottom:1px solid var(--line); vertical-align:top;}
tbody tr:last-child td{border-bottom:none;}
td.r{white-space:nowrap; font-variant-numeric:tabular-nums;}
td small{display:block; font-size:11px; color:var(--muted); font-weight:400; margin-top:1px;}
.qty{font-weight:700; font-size:15px;}
.un{color:var(--muted); font-size:11.5px;}
.delta{color:var(--warn); font-weight:600;}
tr.miss td{background:var(--bad-bg);}
tr.miss td:first-child{color:var(--bad); font-weight:600;}
.tm{color:var(--faint); font-size:12px;}

.empty{padding:48px 24px; text-align:center; color:var(--muted);}
.empty .big{font-size:34px; display:block; margin-bottom:10px;}
.skel{
  height:86px; border-radius:var(--r); margin-bottom:9px;
  background:linear-gradient(90deg,var(--surface) 25%,var(--sunken) 50%,var(--surface) 75%);
  background-size:200% 100%; animation:sh 1.3s infinite;
}
@keyframes sh{to{background-position:-200% 0;}}
.mini{padding:10px 2px; color:var(--muted); font-size:13px;}
.err{
  margin:14px; padding:14px; border-radius:12px; background:var(--bad-bg);
  color:var(--bad); border:1px solid var(--bad-line); font-size:14px;
}
.err code{
  display:block; margin-top:8px; font-size:12px; opacity:.85;
  word-break:break-all; font-family:ui-monospace,monospace;
}
.foot{padding:14px 16px calc(14px + env(safe-area-inset-bottom)); text-align:center;}
.refresh{
  padding:11px 22px; border:1px solid var(--line); border-radius:11px;
  background:var(--surface); color:var(--text); font-size:14px; font-weight:500;
  font-family:inherit; cursor:pointer; box-shadow:var(--shadow);
}
.refresh:active{background:var(--sunken);}
.refresh[disabled]{opacity:.5; cursor:default;}

@media (prefers-reduced-motion: reduce){
  *,.panel,.bar i,.chev{animation:none !important; transition:none !important;}
}
</style>
</head>
<body>

<header>
  <div class="title">เช็คการปรับสต็อก</div>
  <div class="sub" id="sub">กำลังโหลด…</div>
  <div class="stats" id="stats"></div>
  <div class="searchwrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" id="q" placeholder="ค้นหาชื่อร้าน" autocomplete="off">
  </div>
</header>

<main id="app">
  <div class="skel"></div><div class="skel"></div><div class="skel"></div>
</main>

<div class="foot"><button class="refresh" id="btnRefresh">รีเฟรชข้อมูล</button></div>

<script>
/* ============================================================
   URL ของ Google Apps Script Web App (deploy แบบ "Anyone")

   ⚠️ URL นี้อยู่ในไฟล์ จึงถูก commit ขึ้น git และใครเปิด View Source ก็เห็น
      = ใครมี URL นี้ก็ดึงข้อมูลทั้งหมดได้โดยไม่ต้อง login
      -> ตั้ง repo เป็น Private เสมอ
      -> ถ้าอยากซ่อน URL ให้เปลี่ยนเป็น '/api/data' แล้วตั้ง env var GAS_URL
         ใน Vercel แทน (ไฟล์ api/data.js เตรียมไว้ให้แล้ว)
   ============================================================ */
var API_URL = 'https://script.google.com/macros/s/AKfycbzOF8HogURN1v00mShLXCbo54eEQHAbxemV2QJY6l2qPeQEruxpE4LMdMZfv1Dbrgo3Zg/exec';

var DATA = null;
var FILTER = 'open';      // open = ยังไม่ครบ (ค่าเริ่มต้น) | done | partial | none

var $ = function (id) { return document.getElementById(id); };
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}

/* ---------- โหลดข้อมูล ----------
   ดึงครั้งเดียวได้ทุกอย่าง (ร้าน + SKU + รายละเอียด)
   ต่างจากเวอร์ชัน GAS ที่โหลดรายละเอียดตอนกด เพราะที่นี่แต่ละ request
   ต้องวิ่งข้ามไปหา Google ใช้เวลา ~1-2 วิ ถ้าโหลดทีละร้านจะหน่วงทุกครั้งที่กาง  */
function load(){
  $('app').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  $('btnRefresh').disabled = true;

  // ยิงไป GAS ตรงๆ ต้องมี action=all ส่วน /api/data (proxy) ใส่ให้เองอยู่แล้ว
  var url = API_URL + (API_URL.indexOf('http') === 0 ? '?action=all&t=' : '?t=') + Date.now();

  fetch(url, { cache: 'no-store' })
    .then(function(r){ return r.text(); })
    .then(function(txt){
      // GAS ตอบเป็น HTML หน้า login ถ้า deploy ไม่ใช่ "Anyone"
      // ดักไว้ก่อน ไม่งั้นจะเจอ JSON parse error ที่ไม่บอกอะไรเลย
      if (txt.trim().charAt(0) === '<') {
        throw new Error('ได้ HTML แทน JSON — ตรวจว่า deploy GAS เป็น "Anyone" แล้วหรือยัง');
      }
      var d = JSON.parse(txt);
      if (d.error) throw new Error(d.error);
      DATA = d;
      paintHeader(); paint();
    })
    .catch(function(e){
      fail('โหลดข้อมูลไม่สำเร็จ', e && e.message ? e.message : 'เชื่อมต่อไม่ได้');
    })
    .then(function(){ $('btnRefresh').disabled = false; });
}

function fail(msg, detail){
  $('app').innerHTML = '<div class="err">' + esc(msg) +
    (detail ? '<code>' + esc(detail) + '</code>' : '') + '</div>';
}

/* ---------- หัว ---------- */
function paintHeader(){
  var m = DATA.meta;
  $('sub').innerHTML = 'รอบ จ ' + esc(m.monday) + ' – อ ' + esc(m.tuesday) +
    '<span class="dot">•</span>อัปเดต ' + esc(m.updatedAt);

  // การ์ดสถิติกดเพื่อกรองได้เลย กดซ้ำ = ยกเลิก
  var defs = [
    ['done','ครบแล้ว',m.done], ['partial','ทำบางส่วน',m.partial], ['none','ยังไม่ทำเลย',m.none]
  ];
  $('stats').innerHTML = defs.map(function(d){
    return '<div class="stat s-' + d[0] + (FILTER === d[0] ? ' on' : '') + '" data-f="' + d[0] + '">' +
      '<b>' + d[2] + '</b><span>' + d[1] + '</span></div>';
  }).join('');

  Array.prototype.forEach.call($('stats').children, function(el){
    el.addEventListener('click', function(){
      var f = el.getAttribute('data-f');
      FILTER = (FILTER === f) ? 'open' : f;
      paintHeader(); paint();
    });
  });
}

/* ---------- รายการร้าน ---------- */
function paint(){
  var q = ($('q').value || '').trim().toLowerCase();

  var rows = DATA.stores.filter(function(s){
    var st = s[4];
    if (FILTER === 'open' && st === 'done') return false;
    if (FILTER !== 'open' && st !== FILTER) return false;
    return !q || String(s[1]).toLowerCase().indexOf(q) >= 0;
  });

  if (!rows.length){
    $('app').innerHTML = '<div class="empty"><span class="big">' +
      (q ? '🔍' : (FILTER === 'open' ? '🎉' : '—')) + '</span>' +
      (q ? 'ไม่พบร้านที่ค้นหา' :
        (FILTER === 'open' ? 'ทุกร้านปรับสต็อกครบแล้ว' : 'ไม่มีร้านในกลุ่มนี้')) + '</div>';
    return;
  }

  var label = {done:'ครบ', partial:'ค้าง', none:'ยังไม่ทำ'};
  $('app').innerHTML = rows.map(function(s){
    var id = s[0], name = s[1], total = s[2], done = s[3], st = s[4];
    var pct = total ? Math.round(done/total*100) : 0;
    var left = total - done;
    return '<details class="card c-' + st + '" data-id="' + esc(id) + '">' +
      storeSummary(name, st, label[st], left, done, total, pct) +
      '<div class="panel">' + table(DATA.details[id] || []) + '</div></details>';
  }).join('');
}

function storeSummary(name, st, lab, left, done, total, pct){
  return '<summary><div class="head">' +
      '<span class="nm">' + esc(name) + '</span>' +
      '<span class="pill p-' + st + '">' + lab + (st === 'partial' ? ' ' + left : '') + '</span>' +
      '<svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>' +
    '</div>' +
    '<div class="meta"><span><b>' + done + '</b> / ' + total + ' รายการ</span>' +
      '<span>' + pct + '%</span></div>' +
    '<div class="bar"><i style="width:' + pct + '%"></i></div></summary>';
}

/* ---------- ตาราง SKU ---------- */
function table(list){
  if (!list.length) return '<div class="mini">ไม่มีรายการ</div>';

  // "ยังไม่นับ" ขึ้นก่อนเสมอ - สิ่งที่ต้องลงมือต้องอยู่บนสุด ไม่ต้องเลื่อนผ่านของที่ทำแล้ว
  var miss = list.filter(function(r){ return !r[1]; });
  var ok   = list.filter(function(r){ return r[1]; });

  var row = function(r){
    var p = DATA.products[r[0]] || ['#' + r[0], ''];
    if (!r[1]){
      return '<tr class="miss"><td>' + esc(p[0]) + '</td>' +
        '<td class="r" colspan="2">ยังไม่นับ</td></tr>';
    }
    // แสดงส่วนต่างเฉพาะตอนไม่ตรงกับระบบ - เป็นสัญญาณว่าสต็อกเพี้ยน
    var delta = (r[3] !== '' && r[3] != null)
      ? '<small class="delta">' + (r[3] > 0 ? '+' : '') + r[3] + ' จากระบบ</small>' : '';
    var by = r[5] ? '<small>' + esc(r[5]) + '</small>' : '';
    return '<tr><td>' + esc(p[0]) + by + '</td>' +
      '<td class="r"><span class="qty">' + esc(r[2]) + '</span> ' +
        '<span class="un">' + esc(p[1]) + '</span>' + delta + '</td>' +
      '<td class="r tm">' + esc(r[4] || '') + '</td></tr>';
  };

  return '<table><thead><tr><th>สินค้า</th><th class="r">คงเหลือ</th><th class="r">เวลา</th></tr></thead>' +
    '<tbody>' + miss.map(row).join('') + ok.map(row).join('') + '</tbody></table>';
}

/* ---------- ปุ่ม ---------- */
$('q').addEventListener('input', function(){ if (DATA) paint(); });
$('btnRefresh').addEventListener('click', load);

load();
</script>
</body>
</html>
